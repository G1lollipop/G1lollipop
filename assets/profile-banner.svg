    <text x="86" y="154" fill="#f4faf8" font-size="66" font-weight="700" letter-spacing="-1">Hongbo Yu</text>
    <text x="90" y="202" fill="#b4d3d5" font-size="20" font-weight="600" letter-spacing="2">SOFTWARE ENGINEERING  /  APPLIED AI</text>
    <text x="90" y="270" fill="#e0eeee" font-size="23">Building dependable systems for useful AI.</text>
    <text x="90" y="310" fill="#91b9bd" font-size="14" font-weight="600" letter-spacing="1.5">RICE UNIVERSITY  ·  HOUSTON, TEXAS</text>
