<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title description">
  <title id="title">Hongbo Yu — software engineering and applied AI</title>
  <desc id="description">A dark blue banner with a connected systems illustration and a note that Hongbo is based at Rice University in Houston.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d2b"/>
      <stop offset="0.58" stop-color="#112b39"/>
      <stop offset="1" stop-color="#17414b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ee4db"/>
      <stop offset="1" stop-color="#55aabf"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#b9e8e6" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" rx="20" fill="url(#background)"/>
